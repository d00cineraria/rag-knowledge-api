name: RAG Evaluation

on:
  workflow_dispatch:
    inputs:
      top_k:
        description: "検索件数(top_k)"
        required: false
        default: "8"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write .env for docker compose
        run: |
          cp .env.example .env
          sed -i "s/^GEMINI_API_KEY=.*/GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}/" .env

      - name: Start stack
        run: docker compose up --build -d

      - name: Wait for API healthz
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time" >&2
          docker compose logs
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eval/requirements-dev.txt

      - name: Install eval dependencies
        working-directory: eval
        run: pip install -r requirements-dev.txt

      - name: Setup corpus
        id: setup_corpus
        run: |
          collection_id=$(python eval/setup_corpus.py --api-url http://localhost:8000 --api-key dev-local-key)
          echo "collection_id=$collection_id" >> "$GITHUB_OUTPUT"

      - name: Run evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python eval/run_eval.py \
            --api-url http://localhost:8000 \
            --api-key dev-local-key \
            --collection-id "${{ steps.setup_corpus.outputs.collection_id }}" \
            --top-k "${{ github.event.inputs.top_k }}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/results/**

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v
