# ローカル完結構成: DBは単一ファイルのSQLite（./data/rag.db）。
# Dockerなしでも api/ で `uvicorn app.main:app` するだけで動く（README参照）。
services:
  api:
    build: ./api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  ui:
    build: ./ui  # NEXT_PUBLIC_API_URLはビルド時埋め込み（デフォルト http://localhost:8000）
    ports:
      - "3000:3000"
    depends_on:
      - api
